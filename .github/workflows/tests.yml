name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Test
        run: python -m pytest -q

      - name: Smoke checks
        run: |
          wifite3 --version
          wifite3 --help
          python -c "from wifite3.util.paths import find_data_file, wordlist_paths; assert find_data_file('ieee-oui.txt'); assert wordlist_paths()"
          python -c "from wifite3.tui.app import Wifite3App; print('tui import ok')"
